name: CI

# Red de contención mínima (auditoria.md T8). Corre en cada PR y en push a main.
# type-check, tests y lint son gates DUROS (el lint falla solo ante errores; los
# ~34 warnings heredados de react-hooks 7 no bloquean). Sumar `next build`
# cuando haya envs dummy configuradas.

on:
  pull_request:
  push:
    branches: [main]

# Cancela corridas viejas del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (web + admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check web
        run: npm run type-check -w tbm-app
      - name: Type-check admin
        run: npm run type-check -w tbm-admin

  test:
    name: Tests (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm run test -w tbm-app

  lint:
    name: Lint web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint web
        run: npm run lint -w tbm-app
